function agingMassStatus(group){
  const raw=(group.readings||[]).slice(0,3);
  if(raw.length<3||raw.some(v=>String(v).trim()===''))return {value:null,message:'填齐三项质量后自动计算'};
  const [empty,before,after]=raw.map(Number);
  if(![empty,before,after].every(Number.isFinite)||empty<0||before<=empty||after<empty)
    return {value:null,message:'请核对：老化前总质量须大于空容器质量，老化后总质量不得小于空容器质量'};
  const correction=group.massCorrection===undefined||String(group.massCorrection).trim()===''?0:Number(group.massCorrection);
  if(!Number.isFinite(correction))return {value:null,message:'请填写有效的质量变化修正系数'};
  return {value:(after-before)/(before-empty)*100+correction,message:''};
}

function runUI(r){if(isHeating(r))return heatingUI(r);let s=db.samples.find(s=>s.id===r.sampleId);return `<button class="secondary" onclick="goBack()">← ${history.state?.fromCompare?'跨样品对比':esc(s?.name||'样品')}</button><div class="page-heading"><span class="eyebrow">${esc(s?.name||"样品")} · ${esc(r.temp)} ℃</span><h1>${r.phase&&r.phase!=='原样'?esc(r.phase)+' · ':'未老化 · '}${esc(r.name)}</h1><span class="pill ${status(r).type}">${esc(status(r).text)}</span><span class="pill">${r.groups.length} 组数据</span></div><div class="card"><div class="row"><div><label>${isSoftening(r)?"起始温度 ℃":"试验温度 ℃"}</label><input id="runTemp" type="number" step="any" value="${esc(r.temp)}"></div><div><label>容器大小</label><select id="runSize"><option value="小" ${r.size==='小'?'selected':''}>小</option><option value="中" ${r.size==='中'?'selected':''}>中</option><option value="大" ${r.size==='大'?'selected':''}>大</option></select></div></div><label>选择采用规范</label><select onchange="get('runStandard').value=this.value">${runStandardOptions(r).map(v=>`<option value="${esc(v)}" ${v===r.standard?'selected':''}>${esc(v)}</option>`).join('')}</select><label>采用标准（可编辑）</label><input id="runStandard" value="${esc(r.standard)}">${isSoftening(r)?`<label>软化点浴液</label><select id="softeningBath"><option value="">请选择（澳标必填）</option><option value="water" ${softeningBath(r)==='water'?'selected':''}>水浴</option><option value="glycerol" ${softeningBath(r)==='glycerol'?'selected':''}>甘油浴</option></select><p class="muted">${esc(softeningRuleText(r))}</p>`:''}<button class="secondary" onclick="editRun('${r.id}')">保存参数</button></div>${isBBR(r)?'<p class="muted">BBR 国内方法：JTG 3410—2025 / T 0627—2011。暂未确认独立澳洲 AS 方法编号；如需其他方法，请核对后编辑采用标准。S、m 分别记录，不相互求平均。</p>':''}${isAustralianFlashPoint(r)?'<p class="muted">AS 2341.14 开口闪点：最终结果修约至最接近的 10 ℃，原始仪器读数完整保留。</p>':''}<h2>当前阶段与计时</h2>${r.steps.map((x,i)=>stepUI(r,x,i)).join('')}<div class="card"><h2>多组实验数据</h2><p class="muted">同一项目可同时记录基质沥青和多个对比样。每组的名称、读数和备注独立保存，步骤计时由本项目共用。</p><div class="step-actions"><button class="secondary" onclick="addGroup('${r.id}')">＋增加一组</button></div>${r.groups.map((g,i)=>groupUI(r,g,i)).join('')}${/动力[黏粘]度/.test(r.name)&&['RTFOT 老化后','TFOT 老化后'].includes(r.phase)?`<div id="derivedRatioPanel">${derivedUI(r.sampleId,r.id)}</div>`:''}${runInternalStandardUI(r)}<label>项目人工判定（可选）</label><select id="verdict" onchange="saveResultsDraft('${r.id}')"><option value="未判定" ${r.verdict==='未判定'?'selected':''}>未判定</option><option value="合格" ${r.verdict==='合格'?'selected':''}>合格</option><option value="异常" ${r.verdict==='异常'?'selected':''}>异常</option><option value="不合格" ${r.verdict==='不合格'?'selected':''}>不合格</option></select><label>项目总体备注</label><textarea id="notes" oninput="saveResultsDraft('${r.id}')">${esc(r.notes)}</textarea><div class="step-actions"><button onclick="saveResults('${r.id}')">保存全部数据</button></div><p class="muted">各组读数填齐并保存后，项目自动标为已完成，未触发的提醒同时取消。</p><p class="muted">针入度、延度的平均结果取整数；软化点普通测定按本次采用规范和浴液计算；国内按两级 0.5 ℃修约，澳标水浴结果为 0.2 ℃、甘油浴为 0.5 ℃；离析按上下两值的绝对差计算。原始仪器示数完整保留，修约只用于计算；正式报告仍需核对试验次数及允许差。</p></div>`}
function heatingUI(r){let s=db.samples.find(x=>x.id===r.sampleId),step=r.steps[0],remaining=step.started+step.minutes*60000-now,active=step.started&&!stepFinished(step),scheduled=active&&remaining>0&&window.Android?Android.isScheduled(`${r.id}_0`,step.started+step.minutes*60000,true):true;return `<button class="secondary" onclick="goBack()">← ${history.state?.fromCompare?'跨样品对比':esc(s?.name||'样品')}</button><div class="page-heading"><span class="eyebrow">${esc(s?.name||'样品')} · 独立计时</span><h1>加热</h1><span class="pill ${status(r).type}">${esc(status(r).text)}</span></div><div class="card"><label>试样规格</label><select id="heatSize" onchange="selectHeatSize('${r.id}')"><option value="小" ${r.size==='小'?'selected':''}>小试样 · 默认 30 分钟</option><option value="中" ${r.size==='中'?'selected':''}>中试样 · 默认 60 分钟</option><option value="大" ${r.size==='大'?'selected':''}>大试样 · 默认 120 分钟</option></select><label>本次加热时间（分钟，可修改）</label><input id="heatMinutes" type="number" min="1" max="1440" step="1" value="${step.minutes}"><div class="step-actions"><button onclick="editHeating('${r.id}')">保存本次设置</button></div><p class="muted">切换规格会填入建议时间；保存后以显示的分钟数计时。计时中修改时长，会按原开始时间重新计算。</p></div><div class="card step-card"><div class="title"><strong>加热计时</strong><span id="heatClock_${r.id}" class="pill ${step.done?'green':active?'orange':''}">${step.done?'已完成':active?remaining>0?'剩余 '+duration(remaining):'已到点':'待开始'}</span></div><p class="muted">计划 ${step.minutes} 分钟 · 开始 ${stamp(step.started)} · 到点 ${step.started?stamp(step.started+step.minutes*60000):'—'}</p>${active&&!scheduled?`<p class="red">闹铃未安排成功 <button class="secondary" onclick="retryStepAlarm('${r.id}',0)">重新安排</button></p>`:''}<div class="step-actions"><button ${step.done?'disabled':''} onclick="runStepAction('${r.id}',0)">${step.done?'已完成':active?'确认完成':'开始加热'}</button></div></div>`}

function derivedResults(sampleId){
  let runs=db.runs.filter(r=>r.sampleId===sampleId&&!isHeating(r)),out=[];
  for(const aged of runs.filter(r=>r.phase==='RTFOT 老化后'||r.phase==='TFOT 老化后')){
    const dynamic=/动力[黏粘]度/.test(aged.name)&&!/比/.test(aged.name);
    const sameMetric=r=>dynamic?/动力[黏粘]度/.test(r.name)&&!/比/.test(r.name):r.templateId===aged.templateId;
    let bases=runs.filter(r=>(!r.phase||r.phase==='原样')&&sameMetric(r)&&String(r.temp)===String(aged.temp)&&(dynamic?convertInternalValue(1,r.unit,aged.unit)!==null:String(r.unit).trim()===String(aged.unit).trim()));
    if(bases.length!==1||runs.filter(r=>r.phase===aged.phase&&sameMetric(r)&&String(r.temp)===String(aged.temp)).length!==1)continue;
    let base=bases[0],name=String(aged.name),kind=name.includes('针入度')?'针入度比':name.includes('延度')?'延度保留率':name.includes('黏度')||name.includes('粘度')?'黏度比':name.includes('软化点')?'软化点差':null;
    if(!kind)continue;
    for(const group of aged.groups||[]){let matches=(base.groups||[]).filter(g=>g.name===group.name);if(matches.length!==1||isSegregation(aged,group)||isSegregation(base,matches[0]))continue;
      let a=Number(avg(aged,group)),b=Number(avg(base,matches[0]))*(dynamic?convertInternalValue(1,base.unit,aged.unit):1);if(avg(aged,group)==='—'||avg(base,matches[0])==='—'||!Number.isFinite(a)||!Number.isFinite(b)||dynamic&&(a<=0||b<=0)||(!kind.includes('软化点')&&b===0))continue;
      let difference=kind==='软化点差',value=difference?a-b:a/b*(kind==='黏度比'?1:100),unit=difference?'℃':kind==='黏度比'?'倍':'%';
      const evaluation=kind==='黏度比'&&/动力[黏粘]度/.test(name)?evaluateDerivedViscosity(aged,value):null;
      out.push({runId:aged.id,groupName:group.name,projectName:`${aged.phase} · ${name} · ${kind}`,temperature:aged.temp,standard:aged.standard,ratio:value,unit,label:`${aged.phase} · ${name} · ${group.name} · ${kind}`,value:`${Math.round(value*100)/100} ${unit}${evaluation?.unit==='%'?`（${Math.round(value*10000)/100}%）`:''}`,formula:difference?`${a} − ${b}`:`${a} ÷ ${b}${unit==='%'?' × 100':''}`,evaluation});
    }
  }
  return out;
}
function agingMassSummaryRows(sampleId){
  const rows=[];
  for(const run of db.runs.filter(r=>r.sampleId===sampleId&&(isAgingMassLoss(r)||/质量(?:损失|变化)/.test(String(r.name||''))))){
    for(const group of run.groups||[]){
      const result=avg(run,group);if(result==='—'||!Number.isFinite(Number(result)))continue;
      const weighed=isAgingMassLoss(run),label=[run.phase&&run.phase!=='原样'?run.phase:'',run.name,group.name,'质量变化（质量损失）'].filter(Boolean).join(' · ');
      rows.push({runId:run.id,groupName:group.name,label,value:result+' '+resultUnit(run),formula:weighed?agingMassReadingText(group):group.readings.filter(v=>String(v).trim()!=='').join('、'),evaluation:evaluateInternal(run,group)});
    }
  }
  return rows;
}
function agingSummaryResults(sampleId){return [...derivedResults(sampleId),...agingMassSummaryRows(sampleId)]}
function derivedUI(sampleId,runId=null){let rows=(runId?derivedResults(sampleId):agingSummaryResults(sampleId)).filter(x=>!runId||x.runId===runId);return rows.length?`<h2>老化前后结果</h2><div class="card derived-results">${rows.map(x=>`<p><strong>${esc(x.label)}</strong><br>${esc(x.value)} <small class="muted">（${esc(x.formula)}）</small>${x.evaluation?`<br><span class="derived-verdict ${x.evaluation.state}">${internalVerdictHTML(x.evaluation)}</span><small class="muted"> ${esc(x.evaluation.limit||'')}</small>`:''}</p>`).join('')}</div>`:''}
function derivedMarkdown(sampleId){let rows=derivedResults(sampleId);return rows.length?['#### 老化前后计算结果','','| 项目 | 结果 | 算式 | 评价 |','| --- | ---: | --- | --- |',...rows.map(x=>`| ${md(x.label)} | ${md(x.value)} | ${md(x.formula)} | ${md(x.evaluation?((x.evaluation.state==='pass'?'✅ 合格':x.evaluation.state==='fail'?'❌ 不合格':'未判定')+(x.evaluation.limit?'（'+x.evaluation.limit+'）':'')):'—')} |`),'']:[]}
function addTemplate(){let name=get('newTemplateName').value.trim();if(!name)return alert('请填写实验类型名称');if(db.templates.some(t=>t.kind!=='heating'&&t.name.trim()===name))return alert('这个实验类型已经存在');let template={id:uid(),name,initialReadings:get('newTemplateRecordData').value!=='no',standard:'待填写（请核对现行标准）',unit:'待填写',temps:'25',steps:[{name:'样品准备',minutes:0,mode:'none'},{name:'试验测定',minutes:0,mode:'none'}]};db.templates.push(template);ensureMetricStandards();openTemplateId=template.id;save()}
function collectTemplateForm(t){t.name=get('tn'+t.id).value.trim()||t.name;t.standard=get('ts'+t.id).value.trim();t.initialReadings=get('tr'+t.id).value!=='no';t.unit=get('tu'+t.id).value.trim();t.temps=get('tt'+t.id).value.trim();t.steps=t.steps.map((s,i)=>({name:get(`stepName_${t.id}_${i}`)?.value.trim()||s.name,minutes:Number(get(`stepMinutes_${t.id}_${i}`)?.value??s.minutes),mode:get(`stepMode_${t.id}_${i}`)?.value||s.mode}))}
function addTemplateStep(id){let t=db.templates.find(x=>x.id===id);collectTemplateForm(t);t.steps.push({name:'新步骤',minutes:0,mode:'none'});save()}
function removeTemplateStep(id,i){let t=db.templates.find(x=>x.id===id);if(t.steps.length<=1)return alert('模板至少保留一个步骤');collectTemplateForm(t);t.steps.splice(i,1);save()}
function deleteTemplate(id){let t=db.templates.find(x=>x.id===id);if(!t)return;if(!confirm(`确定删除模板“${t.name}”吗？已建立的试验记录不会删除。`))return;db.templates=db.templates.filter(x=>x.id!==id);if(openTemplateId===id)openTemplateId=null;save()}
function duplicateTemplate(id){let t=db.templates.find(t=>t.id===id);let copy={...JSON.parse(JSON.stringify(t)),id:uid(),name:t.name+'（副本）'};db.templates.push(copy);openTemplateId=copy.id;save()}
function saveTemplate(id){let t=db.templates.find(t=>t.id===id);collectTemplateForm(t);if(t.steps.some(s=>!s.name||!Number.isFinite(s.minutes)||s.minutes<0))return alert('请填写步骤名称和有效的等待分钟数');if(t.steps.some(s=>s.mode!=='none'&&s.minutes<=0))return alert('选择消息通知或闹铃的步骤，等待分钟必须大于 0');save();alert('实验类型已保存；新建试验时生效。')}
const md=x=>String(x??'').replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>');
function mdCell(x){return String(x??'').replace(/\s+/g,' ').trim().replace(/\|/g,'\\|')||'—'}
function exportTemperature(value){const text=String(value??'').trim();if(!text)return '—';const bare=text.replace(/\s*(?:℃|°\s*C)\s*$/i,'').trim();return /\d/.test(bare)?bare+' ℃':text}
function exportRunTemperature(run){const value=exportTemperature(run.temp),bath=isSoftening(run)?softeningBath(run):'';return (bath?(bath==='water'?'水浴；':'甘油浴；'):'')+ (isSoftening(run)?'起始':'试验')+' '+(value==='—'?'未填写':value)}
function exportEvaluation(run,group){const result=evaluateInternal(run,group);return result.state==='pass'?'✅ 合格':result.state==='fail'?'❌ 不合格':'未判定'}
function exportResult(run,group){const value=avg(run,group);if(value==='—')return value;const n=Number(value);if(!Number.isFinite(n))return value;if(/动力[黏粘]度/.test(String(run.name||'')))return String(Math.round(n));if(/旋转[黏粘]度/.test(String(run.name||'')))return n.toFixed(2);return value}
function markdown(sampleId='all',runId='all',date='all',includeDetails=false){
  const samples=exportSamplesFor(date).filter(s=>sampleId==='all'||s.id===sampleId)
    .filter(s=>runId==='all'||db.runs.some(r=>r.id===runId&&r.sampleId===s.id));
  const out=['# 沥青实验数据'];
  const dates=[...new Set(samples.map(s=>s.date||localDateKey(s.created)))].sort().reverse();
  for(const day of dates)for(const sample of samples.filter(s=>(s.date||localDateKey(s.created))===day)){
    const runs=db.runs.filter(r=>r.sampleId===sample.id&&(runId==='all'||r.id===runId)&&!isHeating(r)
      &&r.groups?.some(g=>g.readings?.some(v=>String(v).trim()!==''&&Number.isFinite(Number(v)))));
    if(!runs.length)continue;
    const derived=derivedResults(sample.id).filter(x=>runId==='all'||x.runId===runId);
    const tableRows=[],massRows=[];
    for(const run of runs){
      const title=(run.phase&&run.phase!=='原样'?run.phase+' · ':'')+run.name;
      for(const group of run.groups||[]){
        if(!(group.readings||[]).some(v=>String(v).trim()!==''&&Number.isFinite(Number(v))))continue;
        if(isBBR(run)){
          const value=bbrValues(group);
          for(const metric of ['s','m'])tableRows.push({sample:sample.name,group:group.name,title:title+' · '+(metric==='s'?'S(60 s)':'m(60 s)'),unit:metric==='s'?'MPa':'—',result:value?value[metric]:'—',readings:mdCell(bbrReadingText(group,metric)),temperature:exportRunTemperature(run)+'；加载 60 s',standard:run.standard,evaluation:'未判定'});
          continue;
        }
        const readings=isAgingMassLoss(run)?mdCell(agingMassReadingText(group)):(group.readings||[]).map(v=>String(v).trim()?mdCell(v):'—').join('、');
        (isAgingMassLoss(run)||/质量(?:损失|变化)/.test(String(run.name||''))?massRows:tableRows).push({sample:sample.name,group:group.name,title,unit:resultUnit(run),result:exportResult(run,group),readings,temperature:exportRunTemperature(run),standard:run.standard,evaluation:exportEvaluation(run,group)});
      }
    }
    for(const item of derived)tableRows.push({sample:sample.name,group:item.groupName,title:item.projectName,unit:item.unit,result:Math.round(item.ratio*100)/100,readings:item.formula,temperature:exportTemperature(item.temperature),standard:item.standard,evaluation:(item.evaluation?.state==='pass'?'✅ 合格':item.evaluation?.state==='fail'?'❌ 不合格':'未判定')+(item.evaluation?.limit?'（'+item.evaluation.limit+'）':'')});
    tableRows.push(...massRows);
    const showGroup=tableRows.some(row=>String(row.group??'').trim()!==String(sample.name??'').trim());
    out.push('',`## 样品：${mdCell(sample.name)}`,'',
      `| 样品 | ${showGroup?'组别 | ':''}实验项目 | 单位 | 结果 | 原始读数 | 温度条件 | 采用标准 | 评价 |`,
      `| --- | ${showGroup?'--- | ':''}--- | --- | ---: | --- | --- | --- | --- |`);
    for(const row of tableRows)out.push(`| ${mdCell(row.sample)} | ${showGroup?mdCell(row.group)+' | ':''}${mdCell(row.title)} | ${mdCell(row.unit)} | ${mdCell(row.result)} | ${row.readings} | ${mdCell(row.temperature)} | ${mdCell(row.standard)} | ${mdCell(row.evaluation)} |`);
    out.push('',`日期：${day} · 样品数量：${sample.sampleCount||1}`);
    if(!includeDetails)continue;
    out.push('','### 实验条件','',
      '| 实验项目 | 温度条件 | 采用标准 | 人工判定（可选） | 项目备注 |',
      '| --- | ---: | --- | --- | --- |',
      ...runs.map(r=>`| ${mdCell((r.phase&&r.phase!=='原样'?r.phase+' · ':'')+r.name)} | ${mdCell(exportRunTemperature(r))} | ${mdCell(r.standard)} | ${mdCell(r.verdict)} | ${mdCell(r.notes)} |`));
    const steps=runs.flatMap(r=>(r.steps||[]).map(step=>({r,step})));
    if(steps.length)out.push('','### 步骤与时间','',
      '| 实验项目 | 步骤 | 状态 | 计划分钟 | 开始 | 完成 | 耗时 |',
      '| --- | --- | --- | ---: | --- | --- | --- |',
      ...steps.map(({r,step})=>`| ${mdCell((r.phase&&r.phase!=='原样'?r.phase+' · ':'')+r.name)} | ${mdCell(step.name)} | ${step.done?'已完成':step.skipped?'已跳过':step.started?'进行中':'待开始'} | ${step.minutes} | ${stamp(step.started)} | ${stamp(step.done)} | ${step.done&&step.started?duration(step.done-step.started):'—'} |`));
  }
  return out.join('\n')+'\n';
}

function download(name,content,type){if(window.Android){if(typeof Android.textExportStart==='function'){exportNativeText(name,content,type);return}try{const result=Android.saveFile(name,content,type);if(result){const r=JSON.parse(result);if(!r.ok)throw Error(r.error)}}catch(e){alert('导出失败：'+e.message)}return}let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportMarkdown(){let date=get('exportDate').value,sampleId=get('exportSample').value,runId=get('exportRun').value,sample=db.samples.find(s=>s.id===sampleId),run=db.runs.find(r=>r.id===runId);if(!db.samples.length)return alert('还没有可导出的记录');let parts=[date==='all'?'全部日期':date,sample?.name||'全部样品',run?(run.phase?run.phase+'_':'')+run.name:'全部实验项目'];if(run&&sampleId==='all')parts[1]=db.samples.find(s=>s.id===run.sampleId)?.name||parts[1];let filename=parts.join('_').replace(/[\/:*?"<>|]/g,'_')+'_实验记录.md';download(filename,markdown(sampleId,runId,date),'text/markdown')}

function backupJSON(){preserveVisibleDraft();download('沥青实验记录_备份_'+localDateKey(Date.now())+'_'+Date.now()+'.json',JSON.stringify(db,null,2),'application/json')}
function restoreJSON(ev){let f=ev.target.files[0];if(!f)return;if(f.size===0)return alert('备份文件为 0 B，没有可恢复的数据。请更新后重新导出备份。');let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.templates)||!Array.isArray(d.samples)||!Array.isArray(d.runs))throw Error('格式不正确');if(!Array.isArray(d.projectGroups))d.projectGroups=[];if(!Array.isArray(d.yieldObservations))d.yieldObservations=[];if(!Array.isArray(d.yieldGrades))d.yieldGrades=[];if(!d.yieldDrafts||typeof d.yieldDrafts!=='object'||Array.isArray(d.yieldDrafts))d.yieldDrafts={};if(!confirm('确定用备份替换当前数据吗？'))return;db=d;ensureBBRTemplate();ensureMetricStandards();ensureSampleDates();ensureRunGroups();selectedDate=openSample=openRun=null;save()}catch(e){alert('无法恢复：'+e.message)}};reader.readAsText(f)}
function refreshTimers(){
  if(page!=='samples'||navigationAnimating||sectionTouch?.drag||get('photoViewer'))return;
  now=Date.now();
  if(!selectedDate&&!openSample&&!openRun){refreshDashboard();return;}
  if(openRun){
    const run=db.runs.find(r=>r.id===openRun);if(!run)return;
    if(isHeating(run)){
      const step=run.steps[0],clock=get('heatClock_'+run.id);
      if(clock&&step.started&&!stepFinished(step)){
        const left=step.started+step.minutes*60000-now;
        clock.textContent=left>0?'剩余 '+duration(left):'已到点';
      }
    }else run.steps.forEach((step,i)=>{
      const clock=get('stepClock_'+run.id+'_'+i);
      if(!clock||!step.started||stepFinished(step))return;
      const left=step.started+step.minutes*60000-now,ready=left<=0;
      clock.textContent=ready?'可进入下一步 · 已超 '+duration(-left):'等待中 · 还需 '+duration(left);
      clock.classList.toggle('green',ready);clock.classList.toggle('red',!ready);
      clock.closest('.step-card')?.classList.toggle('is-ready',ready);
      clock.closest('.step-card')?.classList.toggle('is-running',!ready);
    });
    return;
  }
  if(openSample){
    for(const run of db.runs.filter(r=>r.sampleId===openSample)){
      const clock=get('runClock_'+run.id),step=current(run);
      if(!clock||!step)continue;
      const left=step.started+step.minutes*60000-now;
      clock.textContent=' · '+(step.minutes<=0?'手动步骤':left>0?'剩余 '+duration(left):'已到点');
    }
    return;
  }
  if(selectedDate)for(const sample of db.samples.filter(s=>(s.date||localDateKey(s.created))===selectedDate)){
    const clock=get('sampleTiming_'+sample.id);if(!clock)continue;
    const runs=db.runs.filter(r=>r.sampleId===sample.id),busy=runs.filter(r=>!r.steps.every(stepFinished));
    const timing=runs.filter(r=>{const step=current(r);return step&&step.minutes>0&&step.started+step.minutes*60000>now}).length;
    clock.textContent=timing?timing+' 项计时中':busy.length?busy.length+' 项未完成':runs.length?'已完成':'待建项目';
    clock.classList.toggle('orange',!!timing);clock.classList.toggle('red',!timing&&!!busy.length);
    clock.classList.toggle('green',!timing&&!busy.length&&!!runs.length);
  }
}
initPhotoRecords();setInterval(refreshTimers,1000);render();
